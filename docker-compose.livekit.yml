services:
  livekit:
    # Pinned so the image can be pre-fetched once and reused offline.
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml
    ports:
      # Local-development service: never expose it on the LAN by default.
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./livekit.local.yaml:/etc/livekit.yaml:ro
