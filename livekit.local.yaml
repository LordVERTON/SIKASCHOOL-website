# Local-only LiveKit configuration. Do not use these development credentials
# outside this machine.
port: 7880
bind_addresses:
  - "0.0.0.0"
development: true

rtc:
  # Docker Desktop forwards these loopback ports to the container. Advertising
  # loopback keeps browser-to-server WebRTC entirely on the development host.
  node_ip: 127.0.0.1
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: false

keys:
  devkey: secret
